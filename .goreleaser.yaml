# GoReleaser configuration for the verifyinboxes command-line tool.
#
#   goreleaser check                       # validate this file
#   goreleaser build --snapshot --clean    # cross-compile into dist/, no release
#   goreleaser release --clean             # on a tag vX.Y.Z, with GITHUB_TOKEN and HOMEBREW_TAP_GITHUB_TOKEN set:
#                                          # build, archive, checksum, release, and update the Homebrew cask
#
# .github/workflows/release.yml runs the last one when a tag vX.Y.Z is pushed. The release is created as a draft:
# look its files over, then publish it (`gh release edit vX.Y.Z --draft=false`). install.sh sees it once published.
version: 2

project_name: verifyinboxes

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: verifyinboxes
    main: ./cmd/verifyinboxes
    binary: verifyinboxes
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.commit={{ .ShortCommit }} -X main.date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: verifyinboxes
    # verifyinboxes_0.1.0_linux_amd64.tar.gz — install.sh builds the same name.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  draft: true
  prerelease: auto
  github:
    owner: verifyinboxes
    name: verifyinboxes-cli

# Homebrew: GoReleaser writes the cask Casks/verifyinboxes.rb into github.com/verifyinboxes/homebrew-tap, so that
#
#   brew install verifyinboxes/tap/verifyinboxes
#
# installs the release. It pushes with HOMEBREW_TAP_GITHUB_TOKEN, a token that can write to that repository (the
# release workflow's own GITHUB_TOKEN cannot reach another repository); .github/workflows/release.yml passes the
# repository secret of that name. A pre-release (v1.2.3-rc.1) leaves the cask as it is.
homebrew_casks:
  - name: verifyinboxes
    binaries:
      - verifyinboxes
    homepage: https://verifyinboxes.com
    description: Check email addresses with VerifyInboxes from the command line
    repository:
      owner: verifyinboxes
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: VerifyInboxes
      email: developers@verifyinboxes.com
    skip_upload: auto
    # The binary is not signed or notarised by Apple: without this, macOS quarantines it and refuses to run it. A
    # download that was never quarantined has nothing to remove, which is not a reason to fail the install.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/verifyinboxes"], must_succeed: false
          end
